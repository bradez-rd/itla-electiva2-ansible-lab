---
- name: Configurar los cinco servidores de Electiva 2
  hosts: servidores
  become: true
  gather_facts: true

  tasks:
    - name: Actualizar caché de APT
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Instalar cowsay y htop
      ansible.builtin.apt:
        name:
          - cowsay
          - htop
        state: present

    - name: Crear usuario itla
      ansible.builtin.user:
        name: itla
        shell: /bin/bash
        create_home: true
        state: present

    - name: Crear carpeta app
      ansible.builtin.file:
        path: /home/itla/app
        state: directory
        owner: itla
        group: itla
        mode: "0755"

    - name: Crear hola.txt
      ansible.builtin.copy:
        dest: /home/itla/app/hola.txt
        content: "Hola desde {{ inventory_hostname }} — automatizado con Ansible.\n"
        owner: itla
        group: itla
        mode: "0644"
